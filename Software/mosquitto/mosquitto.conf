# Mosquitto 2 for the BMS. Clients must log in; each user may only use its own topics.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# Telemetry is live data; the gateway buffers on its own side, the broker does not need to.
persistence false
max_queued_messages 200

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
