# Serves the dashboard and proxies the API, so the browser sees a single origin
# (the session cookie is SameSite=Strict and needs no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Live stream: no buffering, long-lived connection
    location ~ ^/api/v1/packs/[0-9]+/stream$ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
