; Distributed BMS - Node 3 IoT Gateway (ESP32 DevKit V1)
; Build:  pio run          Upload: pio run -t upload      Monitor: pio device monitor
; Before the first build copy include/secrets.example.h to include/secrets.h
; and fill in the Wi-Fi and MQTT details.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -I${PROJECT_DIR}/../common
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
